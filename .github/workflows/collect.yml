name: Collecte quotidienne PhilPapers

on:
  schedule:
    - cron: "30 10 * * *"   # chaque jour vers 6 h 30 (heure de l'Est) ; GitHub peut décaler de quelques minutes
  workflow_dispatch:        # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - run: python collector/test_lang.py
      - run: python collector/collect.py
      - name: Publier les nouvelles données
        run: |
          git config user.name "philmind-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data
          git diff --cached --quiet || git commit -m "Nouveautés du $(date -u +%F)"
          git push
